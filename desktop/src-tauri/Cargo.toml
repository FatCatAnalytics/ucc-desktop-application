[package]
name = "ucc-mapping-desktop"
version = "0.1.0"
description = "UCC → master-mapping desktop app (Tauri shell around the local ucc-engine sidecar)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ucc_mapping_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# cfb (pulled in by tauri via `infer`) is blocked by the corporate proxy on some machines,
# so its source ships with the repo. Same version and contents as crates.io cfb 0.14.0.
[patch.crates-io]
cfb = { path = "vendor/cfb" }
