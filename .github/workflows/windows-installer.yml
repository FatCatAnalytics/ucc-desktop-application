# Builds the Windows installer (NSIS .exe) for the UCC Mapping desktop app.
#
# The Python engine is frozen with PyInstaller, which cannot cross-compile, so
# this has to run on a Windows runner. Result: an artifact on every run, plus a
# GitHub Release when a `v*` tag is pushed.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "feat/updated-master-and-merged"]
    paths: ["engine/**", "desktop/**", ".github/workflows/windows-installer.yml"]
  pull_request:
    paths: ["engine/**", "desktop/**", ".github/workflows/windows-installer.yml"]

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # release upload on tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # --- toolchains -----------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # --- engine sidecar (PyInstaller one-file .exe) ----------------------
      - name: Install engine
        run: |
          uv venv --python 3.11 engine/.venv
          uv pip install --python engine/.venv/Scripts/python.exe -e "engine[build,sql,dev]"

      - name: Engine tests (incl. the matching-quality hold-out on input/Master Mapping.csv)
        run: engine/.venv/Scripts/python.exe -m pytest -q engine/tests

      - name: Freeze sidecar
        run: engine/.venv/Scripts/python.exe engine/scripts/build_sidecar.py

      - name: Smoke-test frozen sidecar
        run: |
          $exe = Get-ChildItem desktop/src-tauri/binaries/ucc-engine-*.exe | Select-Object -First 1
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "frozen sidecar failed to start" }

      # --- desktop app + NSIS installer ------------------------------------
      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npm run app:build -- --bundles nsis

      - name: Collect installer
        id: installer
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length / 1MB)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: UCC-Mapping-windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.installer.outputs.path }}
          generate_release_notes: true
